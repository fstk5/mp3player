[project]
name = "mp3player"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "adafruit-circuitpython-display-text==5.0.6",
    "adafruit-circuitpython-displayio-ssd1306==3.0.6",
    "adafruit-circuitpython-pathlib>=1.0.5",
    "adafruit-circuitpython-sd==3.3.30",
    "adafruit-circuitpython-seesaw==1.18.2",
    "adafruit-circuitpython-tlv320==1.4.0",
    "circuitpython-stubs==10.3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RET",
    "C4",
    "PTH",
    "RUF",
]
ignore = [
    "E501",
    "RET505",
]

[tool.ruff.lint.isort]
known-first-party = ["mp3player"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"
